# CI for Meek Earth STUDIO.
# Firebase App Hosting auto-deploys from the connected GitHub repo on push
# to the live branch — this workflow gates that deploy with a build check.
# (No rules deploy: the site uses Kit for emails and server-side signed
# URLs for storage; Firestore is unused.)
name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ID: meek-earth-studio
